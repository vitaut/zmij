name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        cmake-args: [""]
        include:
          - os: ubuntu-24.04
            cmake-args: -DZMIJ_USE_CONSTEXPR=OFF -DCMAKE_CXX_STANDARD=11
          - os: macos-15
            cmake-args: -DZMIJ_USE_CONSTEXPR=OFF -DCMAKE_CXX_STANDARD=11
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build ${{ matrix.cmake-args }}
      # --config/-C is required for multi-config generators and a noop on
      # single-config ones.
      - run: cmake --build build --config Debug -j
      - run: ctest --test-dir build -C Debug --output-on-failure
